<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sorry Vijju</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Pacifico&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="scene">
      <div class="sparkles" aria-hidden="true">
        <span>💖</span>
        <span>💗</span>
        <span>💞</span>
        <span>❤</span>
        <span>💖</span>
        <span>💗</span>
        <span>💞</span>
        <span>❤</span>
        <span>💖</span>
        <span>💗</span>
      </div>

      <main class="card">
        <p class="tiny-tag">For my sweetest girl</p>
        <h1 id="messageBubble">Tap the bunny</h1>

        <button id="rabbit" class="rabbit" type="button" aria-label="Tap the rabbit to reveal the message">
          <span class="ear left"></span>
          <span class="ear right"></span>

          <span class="head">
            <span class="eye left"></span>
            <span class="eye right"></span>
            <span class="nose"></span>
            <span class="blush left"></span>
            <span class="blush right"></span>
          </span>

          <span class="body">
            <span class="paw left"></span>
            <span class="paw right"></span>
            <span class="arm left"></span>
            <span class="arm right"></span>
          </span>
        </button>

        <p class="hint">Tap to reveal</p>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
