<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sorry Vijju</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Pacifico&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="scene">
      <div class="sparkles" aria-hidden="true">
        <span>💖</span>
        <span>💗</span>
        <span>💞</span>
        <span>❤</span>
        <span>💖</span>
        <span>💗</span>
        <span>💞</span>
        <span>❤</span>
        <span>💖</span>
        <span>💗</span>
      </div>

      <main class="card">
        <p class="tiny-tag">For my sweetest girl</p>
        <h1 id="messageBubble" aria-live="polite">Tap the Box</h1>

        <button id="rabbit" class="rabbit" type="button" aria-label="Open the gift and meet the bunny">
          <span class="bunny-stage" aria-hidden="true">
            <svg class="bunny-art" viewBox="0 0 240 270">
            <defs>
              <linearGradient id="bunny-fur" x1="0" y1="0" x2="0.8" y2="1">
                <stop offset="0" stop-color="#fff" />
                <stop offset="1" stop-color="#fff0f6" />
              </linearGradient>
              <linearGradient id="bunny-ear" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#ffb5d1" />
                <stop offset="1" stop-color="#ff82b4" />
              </linearGradient>
              <filter id="bunny-shadow" x="-30%" y="-30%" width="160%" height="170%">
                <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#b64d7d" flood-opacity=".14" />
              </filter>
            </defs>

            <ellipse cx="120" cy="251" rx="57" ry="8" fill="#d978a0" opacity=".14" />

            <g filter="url(#bunny-shadow)" stroke="#e99fbe" stroke-width="3.5" stroke-linejoin="round">
              <path d="M81 119C72 92 59 57 60 29c1-22 20-26 29-8 12 23 19 57 21 91Z" fill="url(#bunny-fur)" />
              <path d="M159 119c9-27 22-62 21-90-1-22-20-26-29-8-12 23-19 57-21 91Z" fill="url(#bunny-fur)" />
              <path d="M82 88c-6-21-11-43-10-57 1-9 7-11 11-2 8 17 13 40 16 58Z" fill="url(#bunny-ear)" stroke="none" />
              <path d="M158 88c6-21 11-43 10-57-1-9-7-11-11-2-8 17-13 40-16 58Z" fill="url(#bunny-ear)" stroke="none" />
            </g>

            <g stroke="#e99fbe" stroke-width="3.5" stroke-linejoin="round">
              <path d="M79 164c-17 9-27 27-27 48 0 21 14 35 33 35h70c19 0 33-14 33-35 0-21-10-39-27-48Z" fill="url(#bunny-fur)" />
              <ellipse cx="78" cy="235" rx="25" ry="14" fill="#fff" />
              <ellipse cx="162" cy="235" rx="25" ry="14" fill="#fff" />
              <ellipse cx="78" cy="238" rx="8" ry="5" fill="#ffb8d2" stroke="none" />
              <ellipse cx="162" cy="238" rx="8" ry="5" fill="#ffb8d2" stroke="none" />
            </g>

            <g class="arm-left" fill="url(#bunny-fur)" stroke="#e99fbe" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M76 177c-13 7-20 19-17 31 2 8 10 12 17 7l19-17c6-6 5-15-1-20-5-4-12-4-18-1Z" />
            </g>
            <g class="arm-right" fill="url(#bunny-fur)" stroke="#e99fbe" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M164 177c13 7 20 19 17 31-2 8-10 12-17 7l-19-17c-6-6-5-15 1-20 5-4 12-4 18-1Z" />
            </g>

            <ellipse cx="120" cy="119" rx="72" ry="64" fill="url(#bunny-fur)" stroke="#e99fbe" stroke-width="3.5" />

            <g class="eyes-open" fill="#49333d">
              <ellipse cx="94" cy="112" rx="5.5" ry="8" />
              <ellipse cx="146" cy="112" rx="5.5" ry="8" />
            </g>
            <g class="eyes-open" fill="#fff">
              <circle cx="92" cy="109" r="1.8" />
              <circle cx="144" cy="109" r="1.8" />
            </g>
            <g class="eyes-closed" fill="none" stroke="#49333d" stroke-width="3" stroke-linecap="round">
              <path d="M85 114q9 10 18 0M137 114q9 10 18 0" />
            </g>
            <g class="tears">
              <path class="tear tear-left" d="M93 124c0 0-5 7-5 10a5 5 0 0 0 10 0c0-3-5-10-5-10Z" />
              <path class="tear tear-right" d="M147 124c0 0-5 7-5 10a5 5 0 0 0 10 0c0-3-5-10-5-10Z" />
            </g>

            <ellipse cx="77" cy="132" rx="12" ry="6.5" fill="#ffb3cb" opacity=".65" />
            <ellipse cx="163" cy="132" rx="12" ry="6.5" fill="#ffb3cb" opacity=".65" />

            <g fill="none" stroke="#e6a0bc" stroke-width="2" stroke-linecap="round" opacity=".85">
              <path d="M65 125 45 120M65 133 43 135M175 125l20-5M175 133l22 2" />
            </g>

            <ellipse cx="112" cy="130" rx="11" ry="8" fill="#fff" />
            <ellipse cx="128" cy="130" rx="11" ry="8" fill="#fff" />
            <path d="M114 122c0-4 6-5 6-1 0-4 6-3 6 1 0 4-6 7-6 7s-6-3-6-7Z" fill="#ff79a9" />
            <path class="bunny-smile" d="M120 129v5m0 0c-4 5-8 4-10 1m10-1c4 5 8 4 10 1" fill="none" stroke="#9b526d" stroke-width="2" stroke-linecap="round" />
            <ellipse class="kiss-mouth" cx="120" cy="136" rx="4" ry="5" fill="#d978a0" />

            <g class="flower">
              <path d="M177 199Q188 180 194 162" fill="none" stroke="#68a96f" stroke-width="3" stroke-linecap="round" />
              <path d="M184 184q-12-11-14-2 2 9 14 7m4-13q2-12 10-9 2 8-10 13" fill="#82c98a" stroke="#589967" stroke-width="1.5" />
              <g fill="#ff86b4">
                <ellipse cx="194" cy="151" rx="4" ry="8" />
                <ellipse cx="194" cy="151" rx="4" ry="8" transform="rotate(60 194 158)" />
                <ellipse cx="194" cy="151" rx="4" ry="8" transform="rotate(120 194 158)" />
                <ellipse cx="194" cy="151" rx="4" ry="8" transform="rotate(180 194 158)" />
                <ellipse cx="194" cy="151" rx="4" ry="8" transform="rotate(240 194 158)" />
                <ellipse cx="194" cy="151" rx="4" ry="8" transform="rotate(300 194 158)" />
              </g>
              <circle cx="194" cy="158" r="4" fill="#ffd46a" />
            </g>
            <path class="kiss-heart" d="M197 92c-8-7-15 4 0 14 15-10 8-21 0-14Z" />
            </svg>
          </span>
          <svg class="gift-box" viewBox="0 0 240 125" aria-hidden="true">
            <ellipse cx="120" cy="114" rx="87" ry="8" fill="#d978a0" opacity=".16" />
            <g class="gift-lid">
              <path d="M25 29h190v23H25z" fill="#ff80ae" stroke="#d94d8c" stroke-width="3" stroke-linejoin="round" />
              <path d="M105 29c-27-4-31-23-18-25 12-2 23 14 33 25 10-11 21-27 33-25 13 2 9 21-18 25" fill="none" stroke="#ffe0ec" stroke-width="8" stroke-linecap="round" />
              <path d="M120 27v25" stroke="#ffe0ec" stroke-width="8" />
            </g>
            <path d="M39 49h162v61H39z" fill="#ffb5d1" stroke="#d94d8c" stroke-width="3" stroke-linejoin="round" />
            <path d="M104 50h32v60h-32z" fill="#fff0a8" />
            <path d="M25 43h190v17H25z" fill="#ff80ae" stroke="#d94d8c" stroke-width="3" stroke-linejoin="round" />
            <path d="M105 44h30v16h-30z" fill="#ffe0ec" />
          </svg>
        </button>

        <p class="hint">Tap to open your gift</p>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
